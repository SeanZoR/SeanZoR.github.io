<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soluna Pool — Perimeter Overflow Design</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pool-blue:#2d9ecf;--pool-deep:#1a6b8a;--water-top:#4dd9e8;
  --overflow-water:#3a8fa8;--overflow-tank:#5a6a72;--deck:#c4a882;
  --deck-dark:#a8906e;--bg:#1a1a2e;--text:#e0e0e0;
  --step1:#6be0f0;--step2:#45c8dc;--step3:#2a9ab5;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
header{text-align:center;padding:24px 16px 8px}
header h1{font-size:clamp(1.2rem,3vw,1.8rem);font-weight:300;letter-spacing:2px;color:#fff}
header p{font-size:0.85rem;color:#888;margin-top:4px}
.tabs{display:flex;justify-content:center;gap:8px;padding:16px;flex-wrap:wrap}
.tabs button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#ccc;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:0.85rem;transition:.2s}
.tabs button.active{background:var(--pool-blue);color:#fff;border-color:var(--pool-blue)}
.tabs button:hover{background:rgba(255,255,255,.15)}
.view{display:none;justify-content:center;align-items:center;padding:16px;min-height:60vh}
.view.active{display:flex}

/* ===== 3D PERSPECTIVE ===== */
.scene-3d{perspective:900px;width:100%;max-width:700px;height:420px;display:flex;justify-content:center;align-items:center}
.pool-3d{position:relative;width:360px;height:280px;transform-style:preserve-3d;transform:rotateX(55deg) rotateZ(-35deg);transition:transform .5s}
.face{position:absolute;backface-visibility:hidden}

.deck{width:360px;height:280px;background:var(--deck);border:2px solid var(--deck-dark);transform:translateZ(0px);border-radius:4px}
.overflow-ring{position:absolute;width:312px;height:232px;left:24px;top:24px;border:18px solid var(--overflow-tank);transform:translateZ(1px);box-shadow:inset 0 0 8px rgba(0,0,0,.4)}
.overflow-ring::after{content:'';position:absolute;inset:0;background:var(--overflow-water);opacity:.7;animation:overflowPulse 3s ease-in-out infinite}

.pool-top{width:240px;height:160px;left:60px;top:60px;background:linear-gradient(135deg,var(--water-top),var(--pool-blue));transform:translateZ(2px);box-shadow:0 0 20px rgba(77,217,232,.3);overflow:hidden}
.pool-top::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 18px,rgba(255,255,255,.08) 18px,rgba(255,255,255,.08) 20px);animation:ripple 4s linear infinite}
.pool-top::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 14px,rgba(255,255,255,.06) 14px,rgba(255,255,255,.06) 16px);animation:ripple2 5s linear infinite}

/* Steps visible through water in 3D - on top face */
.step-3d-1,.step-3d-2,.step-3d-3{position:absolute;left:60px;transform:translateZ(2px);opacity:.35;pointer-events:none}
.step-3d-1{top:60px;width:240px;height:27px;background:#8eeaf5}
.step-3d-2{top:87px;width:240px;height:27px;background:#5dd5e5}
.step-3d-3{top:114px;width:240px;height:27px;background:#35b0c8}

.pool-front{width:240px;height:50px;left:60px;top:220px;background:linear-gradient(to bottom,var(--pool-blue),var(--pool-deep));transform-origin:top;transform:translateZ(2px) rotateX(-90deg);border-bottom:2px solid #155a75}
.pool-right{width:50px;height:160px;left:300px;top:60px;background:linear-gradient(to right,var(--pool-blue),var(--pool-deep));transform-origin:left;transform:translateZ(2px) rotateY(90deg);border-right:2px solid #155a75}

/* Steps on right side (the steps-end wall) */
.step-right-1{position:absolute;width:50px;height:27px;left:300px;top:60px;background:linear-gradient(to right,#6be0f0,#55c5d5);transform-origin:left;transform:translateZ(2px) rotateY(90deg);opacity:.7}
.step-right-2{position:absolute;width:50px;height:27px;left:300px;top:87px;background:linear-gradient(to right,#45c8dc,#35afc5);transform-origin:left;transform:translateZ(2px) rotateY(90deg);opacity:.7}
.step-right-3{position:absolute;width:50px;height:27px;left:300px;top:114px;background:linear-gradient(to right,#2a9ab5,#2088a0);transform-origin:left;transform:translateZ(2px) rotateY(90deg);opacity:.7}

.ot-front{width:312px;height:40px;left:24px;top:256px;background:linear-gradient(to bottom,var(--overflow-tank),#3d4a50);transform-origin:top;transform:translateZ(1px) rotateX(-90deg)}
.ot-right{width:40px;height:232px;left:336px;top:24px;background:linear-gradient(to right,var(--overflow-tank),#3d4a50);transform-origin:left;transform:translateZ(1px) rotateY(90deg)}

.cascade-front{position:absolute;width:240px;height:6px;left:60px;top:220px;background:linear-gradient(to bottom,rgba(77,217,232,.6),transparent);transform:translateZ(2px) rotateX(-90deg);transform-origin:top;animation:cascadePulse 2s ease-in-out infinite}
.cascade-right{position:absolute;width:6px;height:160px;left:300px;top:60px;background:linear-gradient(to right,rgba(77,217,232,.6),transparent);transform:translateZ(2px) rotateY(90deg);transform-origin:left;animation:cascadePulse 2s ease-in-out infinite .5s}
.cascade-back{position:absolute;width:240px;height:6px;left:60px;top:60px;background:linear-gradient(to top,rgba(77,217,232,.5),transparent);transform:translateZ(2px) rotateX(90deg);transform-origin:bottom;animation:cascadePulse 2s ease-in-out infinite .3s}
.cascade-left{position:absolute;width:6px;height:160px;left:60px;top:60px;background:linear-gradient(to left,rgba(77,217,232,.5),transparent);transform:translateZ(2px) rotateY(-90deg);transform-origin:right;animation:cascadePulse 2s ease-in-out infinite .7s}

.label-3d{position:absolute;font-size:10px;color:#fff;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:3px;white-space:nowrap;transform:translateZ(60px);pointer-events:none}

@keyframes ripple{0%{transform:translateX(0)}100%{transform:translateX(20px)}}
@keyframes ripple2{0%{transform:translateY(0)}100%{transform:translateY(16px)}}
@keyframes overflowPulse{0%,100%{opacity:.5}50%{opacity:.8}}
@keyframes cascadePulse{0%,100%{opacity:.3}50%{opacity:.8}}

/* ===== TOP VIEW ===== */
.top-view{position:relative;width:100%;max-width:600px}
.top-view svg{width:100%;height:auto}

/* ===== CROSS SECTION ===== */
.cross-section{position:relative;width:100%;max-width:700px}
.cross-section svg{width:100%;height:auto}

.dims{max-width:700px;margin:0 auto;padding:0 16px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;text-align:center}
.dim-card{background:rgba(255,255,255,.05);border-radius:8px;padding:12px 8px}
.dim-card .val{font-size:1.3rem;font-weight:600;color:var(--water-top)}
.dim-card .lbl{font-size:.7rem;color:#999;margin-top:2px}

@media(max-width:500px){
  .pool-3d{transform:rotateX(55deg) rotateZ(-35deg) scale(.7)}
  .scene-3d{height:320px}
}
</style>
</head>
<body>

<header>
  <h1>Soluna Pool — Perimeter Overflow Design</h1>
  <p>Interactive 3D visualization · with entry steps</p>
</header>

<nav class="tabs">
  <button class="active" data-view="v3d">3D Perspective</button>
  <button data-view="vtop">Top View</button>
  <button data-view="vside">Side Cross-Section</button>
</nav>

<!-- 3D VIEW -->
<section class="view active" id="v3d">
  <div class="scene-3d">
    <div class="pool-3d">
      <div class="face deck"></div>
      <div class="face overflow-ring"></div>
      <div class="face pool-top"></div>
      <!-- Steps visible through water -->
      <div class="step-3d-1"></div>
      <div class="step-3d-2"></div>
      <div class="step-3d-3"></div>
      <!-- Step risers on right side wall -->
      <div class="step-right-1"></div>
      <div class="step-right-2"></div>
      <div class="step-right-3"></div>
      <div class="face pool-front"></div>
      <div class="face pool-right"></div>
      <div class="face ot-front"></div>
      <div class="face ot-right"></div>
      <div class="cascade-front"></div>
      <div class="cascade-right"></div>
      <div class="cascade-back"></div>
      <div class="cascade-left"></div>
      <span class="label-3d" style="left:120px;top:265px">12m</span>
      <span class="label-3d" style="left:310px;top:130px">4m</span>
      <span class="label-3d" style="left:305px;top:245px">1.5m deep</span>
      <span class="label-3d" style="left:24px;top:36px">0.70m overflow</span>
      <span class="label-3d" style="left:130px;top:58px;font-size:8px;background:rgba(0,0,0,.5)">Steps →</span>
      <span class="label-3d" style="left:60px;top:68px;font-size:8px;background:rgba(0,0,0,.4)">15cm</span>
      <span class="label-3d" style="left:60px;top:95px;font-size:8px;background:rgba(0,0,0,.4)">35cm</span>
      <span class="label-3d" style="left:60px;top:122px;font-size:8px;background:rgba(0,0,0,.4)">120cm</span>
    </div>
  </div>
</section>

<!-- TOP VIEW -->
<section class="view" id="vtop">
  <div class="top-view">
    <svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">
      <!-- Deck -->
      <rect x="20" y="20" width="560" height="300" rx="6" fill="#c4a882" stroke="#a8906e" stroke-width="2"/>
      <!-- Overflow tank -->
      <rect x="50" y="50" width="500" height="240" rx="4" fill="#5a6a72" stroke="#4a5a62" stroke-width="1.5"/>
      <rect x="50" y="50" width="500" height="240" rx="4" fill="#3a8fa8" opacity=".5">
        <animate attributeName="opacity" values=".4;.7;.4" dur="3s" repeatCount="indefinite"/>
      </rect>
      <!-- Main pool -->
      <rect x="80" y="80" width="440" height="180" rx="2" fill="url(#poolGrad)" stroke="#1a6b8a" stroke-width="1"/>

      <!-- Entry steps (left side = one short end) -->
      <!-- Each step is 2m of 12m total → 2/12 of 440px = ~73px each -->
      <!-- Step 1: shallowest (15cm) - lightest blue -->
      <rect x="80" y="80" width="73" height="180" fill="#7aeaf5" opacity=".7" stroke="#5ad0e0" stroke-width=".5"/>
      <!-- Step 2: 35cm -->
      <rect x="153" y="80" width="73" height="180" fill="#50d0e2" opacity=".7" stroke="#3ab8cc" stroke-width=".5"/>
      <!-- Step 3: 120cm -->
      <rect x="226" y="80" width="74" height="180" fill="#2aa5be" opacity=".7" stroke="#1e8da5" stroke-width=".5"/>
      <!-- Deep zone (remaining 6m) stays as pool gradient underneath -->

      <!-- Step zone divider lines -->
      <line x1="153" y1="80" x2="153" y2="260" stroke="rgba(255,255,255,.25)" stroke-width="1" stroke-dasharray="4"/>
      <line x1="226" y1="80" x2="226" y2="260" stroke="rgba(255,255,255,.25)" stroke-width="1" stroke-dasharray="4"/>
      <line x1="300" y1="80" x2="300" y2="260" stroke="rgba(255,255,255,.3)" stroke-width="1.5" stroke-dasharray="4"/>

      <!-- Ripple lines (deep zone only) -->
      <g stroke="rgba(255,255,255,.15)" stroke-width=".7" fill="none">
        <line x1="310" y1="130" x2="510" y2="130"><animate attributeName="y1" values="130;135;130" dur="3s" repeatCount="indefinite"/><animate attributeName="y2" values="130;135;130" dur="3s" repeatCount="indefinite"/></line>
        <line x1="310" y1="170" x2="510" y2="170"><animate attributeName="y1" values="170;165;170" dur="4s" repeatCount="indefinite"/><animate attributeName="y2" values="165;170;165" dur="4s" repeatCount="indefinite"/></line>
        <line x1="310" y1="210" x2="510" y2="210"><animate attributeName="y1" values="210;215;210" dur="3.5s" repeatCount="indefinite"/><animate attributeName="y2" values="215;210;215" dur="3.5s" repeatCount="indefinite"/></line>
      </g>

      <!-- Overflow arrows -->
      <g fill="none" stroke="#4dd9e8" stroke-width="1" opacity=".6">
        <line x1="300" y1="80" x2="300" y2="55" marker-end="url(#arr)"><animate attributeName="opacity" values=".3;.8;.3" dur="2s" repeatCount="indefinite"/></line>
        <line x1="300" y1="260" x2="300" y2="285" marker-end="url(#arr)"><animate attributeName="opacity" values=".3;.8;.3" dur="2s" repeatCount="indefinite" begin=".5s"/></line>
        <line x1="80" y1="170" x2="55" y2="170" marker-end="url(#arr)"><animate attributeName="opacity" values=".3;.8;.3" dur="2s" repeatCount="indefinite" begin=".3s"/></line>
        <line x1="520" y1="170" x2="545" y2="170" marker-end="url(#arr)"><animate attributeName="opacity" values=".3;.8;.3" dur="2s" repeatCount="indefinite" begin=".7s"/></line>
      </g>
      <defs>
        <linearGradient id="poolGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4dd9e8"/><stop offset="100%" stop-color="#2d9ecf"/></linearGradient>
        <marker id="arr" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4dd9e8"/></marker>
      </defs>

      <!-- Step labels -->
      <g font-family="system-ui" font-size="10" fill="#fff" text-anchor="middle">
        <text x="116" y="165" font-size="9" font-weight="600">Step 1</text>
        <text x="116" y="178" font-size="8" fill="#ddd">15cm</text>
        <text x="116" y="190" font-size="8" fill="#ccc">2m</text>

        <text x="190" y="165" font-size="9" font-weight="600">Step 2</text>
        <text x="190" y="178" font-size="8" fill="#ddd">35cm</text>
        <text x="190" y="190" font-size="8" fill="#ccc">2m</text>

        <text x="263" y="165" font-size="9" font-weight="600">Step 3</text>
        <text x="263" y="178" font-size="8" fill="#ddd">120cm</text>
        <text x="263" y="190" font-size="8" fill="#ccc">2m</text>

        <text x="410" y="170" font-size="11" fill="#fff" opacity=".5">DEEP ZONE</text>
        <text x="410" y="185" font-size="9" fill="#aaa" opacity=".5">1.5m · 6m long</text>
      </g>

      <!-- "ENTRY" label with arrow -->
      <g font-family="system-ui" font-size="9" fill="#4dd9e8">
        <text x="80" y="74" font-weight="600">ENTRY ↓</text>
      </g>

      <!-- Dimension labels -->
      <g font-family="system-ui" font-size="11" fill="#fff">
        <line x1="80" y1="290" x2="520" y2="290" stroke="#fff" stroke-width=".5" opacity=".5"/>
        <text x="300" y="305" text-anchor="middle" font-weight="600">12m</text>
        <line x1="545" y1="80" x2="545" y2="260" stroke="#fff" stroke-width=".5" opacity=".5"/>
        <text x="560" y="175" text-anchor="start" font-weight="600">4m</text>
        <text x="65" y="72" font-size="9" fill="#ccc">0.70m</text>
        <line x1="50" y1="46" x2="80" y2="46" stroke="#ccc" stroke-width=".5"/>

        <!-- 6m steps zone -->
        <line x1="80" y1="300" x2="300" y2="300" stroke="#4dd9e8" stroke-width=".5" opacity=".6"/>
        <text x="190" y="315" text-anchor="middle" font-size="9" fill="#4dd9e8">6m (steps)</text>
        <!-- 6m deep zone -->
        <line x1="300" y1="300" x2="520" y2="300" stroke="#aaa" stroke-width=".5" opacity=".5"/>
        <text x="410" y="315" text-anchor="middle" font-size="9" fill="#aaa">6m (full depth)</text>
      </g>
    </svg>
  </div>
</section>

<!-- CROSS SECTION VIEW (lengthwise) -->
<section class="view" id="vside">
  <div class="cross-section">
    <svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
      <!-- Ground line -->
      <line x1="20" y1="280" x2="680" y2="280" stroke="#555" stroke-width="1" stroke-dasharray="4"/>

      <!-- Deck left -->
      <rect x="30" y="100" width="50" height="20" fill="#c4a882" stroke="#a8906e"/>
      <!-- Overflow tank left -->
      <rect x="80" y="100" width="40" height="160" fill="#5a6a72" stroke="#4a5a62" stroke-width="1.5"/>
      <rect x="81" y="120" width="38" height="139" fill="#3a8fa8" opacity=".6">
        <animate attributeName="opacity" values=".4;.7;.4" dur="3s" repeatCount="indefinite"/>
      </rect>

      <!-- Pool wall left -->
      <rect x="120" y="80" width="10" height="180" fill="#d0d0d0" stroke="#999"/>

      <!-- Pool structure with steps -->
      <!-- The pool interior goes from x=130 to x=550, total 420px for 12m -->
      <!-- Each 2m step = 70px, 6m deep zone = 210px -->

      <!-- Pool floor (full depth area: from x=340 to x=550) -->
      <rect x="130" y="80" width="420" height="180" fill="#1a3a4a" stroke="none"/>

      <!-- Step structure (concrete/tile) -->
      <!-- Step 1: 15cm deep → 15/150 * 170 = 17px from water surface (y=82) → y=99 -->
      <!-- Step 2: 35cm deep → 35/150 * 170 = 40px → y=122 -->
      <!-- Step 3: 120cm deep → 120/150 * 170 = 136px → y=218 -->
      <!-- Pool floor at 1.5m: y=252 -->

      <!-- Step 1 platform -->
      <rect x="130" y="99" width="70" height="153" fill="#b0b8bc" stroke="#888"/>
      <!-- Step 2 platform -->
      <rect x="200" y="122" width="70" height="130" fill="#a0a8ac" stroke="#888"/>
      <!-- Step 3 platform -->
      <rect x="270" y="218" width="70" height="34" fill="#909898" stroke="#888"/>
      <!-- Pool floor -->
      <rect x="340" y="252" width="210" height="8" fill="#7a8585" stroke="#666"/>

      <!-- Pool walls outline -->
      <line x1="130" y1="80" x2="130" y2="260" stroke="#999" stroke-width="1.5"/>
      <line x1="550" y1="80" x2="550" y2="260" stroke="#999" stroke-width="1.5"/>
      <line x1="130" y1="260" x2="550" y2="260" stroke="#999" stroke-width="1"/>

      <!-- Water fill (layered over steps) -->
      <!-- Water above step 1 -->
      <rect x="131" y="82" width="69" height="17" fill="#4dd9e8" opacity=".5"/>
      <!-- Water above step 2 -->
      <rect x="200" y="82" width="70" height="40" fill="#42cde0" opacity=".5"/>
      <!-- Water above step 3 -->
      <rect x="270" y="82" width="70" height="136" fill="#38c0d5" opacity=".5"/>
      <!-- Water in deep zone -->
      <rect x="340" y="82" width="209" height="170" fill="url(#waterGrad2)" opacity=".75">
        <animate attributeName="opacity" values=".65;.85;.65" dur="4s" repeatCount="indefinite"/>
      </rect>

      <!-- Water surface shimmer -->
      <line x1="135" y1="84" x2="545" y2="84" stroke="rgba(255,255,255,.35)" stroke-width="1.5">
        <animate attributeName="opacity" values=".2;.6;.2" dur="2s" repeatCount="indefinite"/>
      </line>

      <!-- Pool wall right -->
      <rect x="550" y="80" width="10" height="180" fill="#d0d0d0" stroke="#999"/>
      <!-- Overflow tank right -->
      <rect x="560" y="100" width="40" height="160" fill="#5a6a72" stroke="#4a5a62" stroke-width="1.5"/>
      <rect x="561" y="120" width="38" height="139" fill="#3a8fa8" opacity=".6">
        <animate attributeName="opacity" values=".4;.7;.4" dur="3s" repeatCount="indefinite" begin="1s"/>
      </rect>
      <!-- Deck right -->
      <rect x="600" y="100" width="50" height="20" fill="#c4a882" stroke="#a8906e"/>

      <!-- Overflow cascades -->
      <path d="M131,82 Q126,90 122,100 Q119,110 119,120" fill="none" stroke="#4dd9e8" stroke-width="2" opacity=".5">
        <animate attributeName="opacity" values=".2;.7;.2" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M549,82 Q554,90 558,100 Q561,110 561,120" fill="none" stroke="#4dd9e8" stroke-width="2" opacity=".5">
        <animate attributeName="opacity" values=".2;.7;.2" dur="2s" repeatCount="indefinite" begin=".5s"/>
      </path>

      <defs>
        <linearGradient id="waterGrad2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4dd9e8"/><stop offset="100%" stop-color="#1a6b8a"/></linearGradient>
      </defs>

      <!-- Depth dimension lines and labels -->
      <g font-family="system-ui" fill="#e0e0e0">
        <!-- Water level label -->
        <text x="155" y="78" font-size="9" fill="#4dd9e8">← water level (flush)</text>

        <!-- Step depth labels (right side of steps) -->
        <!-- Step 1: 15cm -->
        <line x1="195" y1="82" x2="208" y2="82" stroke="#fff" stroke-width=".5" opacity=".4"/>
        <line x1="195" y1="99" x2="208" y2="99" stroke="#fff" stroke-width=".5" opacity=".4"/>
        <line x1="202" y1="82" x2="202" y2="99" stroke="#fff" stroke-width=".5" opacity=".4"/>
        <text x="212" y="94" font-size="8" fill="#4dd9e8" font-weight="600">15cm</text>

        <!-- Step 2: 35cm -->
        <line x1="265" y1="82" x2="278" y2="82" stroke="#fff" stroke-width=".5" opacity=".4"/>
        <line x1="265" y1="122" x2="278" y2="122" stroke="#fff" stroke-width=".5" opacity=".4"/>
        <line x1="272" y1="82" x2="272" y2="122" stroke="#fff" stroke-width=".5" opacity=".4"/>
        <text x="282" y="107" font-size="8" fill="#4dd9e8" font-weight="600">35cm</text>

        <!-- Step 3: 120cm -->
        <line x1="335" y1="82" x2="348" y2="82" stroke="#fff" stroke-width=".5" opacity=".4"/>
        <line x1="335" y1="218" x2="348" y2="218" stroke="#fff" stroke-width=".5" opacity=".4"/>
        <line x1="342" y1="82" x2="342" y2="218" stroke="#fff" stroke-width=".5" opacity=".4"/>
        <text x="352" y="155" font-size="8" fill="#4dd9e8" font-weight="600">120cm</text>

        <!-- Full depth: 150cm -->
        <line x1="580" y1="82" x2="590" y2="82" stroke="#fff" stroke-width=".5" opacity=".4"/>
        <line x1="580" y1="252" x2="590" y2="252" stroke="#fff" stroke-width=".5" opacity=".4"/>
        <line x1="585" y1="82" x2="585" y2="252" stroke="#fff" stroke-width=".5" opacity=".4"/>
        <text x="594" y="170" font-size="10" font-weight="600">1.5m</text>

<script>
document.querySelectorAll('.tabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.view).classList.add('active');
  });
});
</script>
