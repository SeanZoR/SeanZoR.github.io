<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soluna Pool — Perimeter Overflow Design</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pool-blue:#2d9ecf;--pool-deep:#1a6b8a;--water-top:#4dd9e8;
  --overflow-water:#3a8fa8;--overflow-tank:#5a6a72;--deck:#c4a882;
  --deck-dark:#a8906e;--bg:#1a1a2e;--text:#e0e0e0;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
header{text-align:center;padding:24px 16px 8px}
header h1{font-size:clamp(1.2rem,3vw,1.8rem);font-weight:300;letter-spacing:2px;color:#fff}
header p{font-size:0.85rem;color:#888;margin-top:4px}
.tabs{display:flex;justify-content:center;gap:8px;padding:16px;flex-wrap:wrap}
.tabs button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#ccc;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:0.85rem;transition:.2s}
.tabs button.active{background:var(--pool-blue);color:#fff;border-color:var(--pool-blue)}
.tabs button:hover{background:rgba(255,255,255,.15)}
.view{display:none;justify-content:center;align-items:center;padding:16px;min-height:60vh}
.view.active{display:flex}

/* ===== 3D PERSPECTIVE ===== */
.scene-3d{perspective:900px;width:100%;max-width:700px;height:420px;display:flex;justify-content:center;align-items:center}
.pool-3d{position:relative;width:360px;height:280px;transform-style:preserve-3d;transform:rotateX(55deg) rotateZ(-35deg);transition:transform .5s}
.face{position:absolute;backface-visibility:hidden}

/* Deck */
.deck{width:360px;height:280px;background:var(--deck);border:2px solid var(--deck-dark);transform:translateZ(0px);border-radius:4px}

/* Overflow tank - rendered as border effect on deck */
.overflow-ring{position:absolute;width:312px;height:232px;left:24px;top:24px;border:18px solid var(--overflow-tank);transform:translateZ(1px);box-shadow:inset 0 0 8px rgba(0,0,0,.4)}
.overflow-ring::after{content:'';position:absolute;inset:0;background:var(--overflow-water);opacity:.7;animation:overflowPulse 3s ease-in-out infinite}

/* Main pool top */
.pool-top{width:240px;height:160px;left:60px;top:60px;background:linear-gradient(135deg,var(--water-top),var(--pool-blue));transform:translateZ(2px);box-shadow:0 0 20px rgba(77,217,232,.3);overflow:hidden}
.pool-top::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 18px,rgba(255,255,255,.08) 18px,rgba(255,255,255,.08) 20px);animation:ripple 4s linear infinite}
.pool-top::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 14px,rgba(255,255,255,.06) 14px,rgba(255,255,255,.06) 16px);animation:ripple2 5s linear infinite}

/* Pool sides */
.pool-front{width:240px;height:50px;left:60px;top:220px;background:linear-gradient(to bottom,var(--pool-blue),var(--pool-deep));transform-origin:top;transform:translateZ(2px) rotateX(-90deg);border-bottom:2px solid #155a75}
.pool-right{width:50px;height:160px;left:300px;top:60px;background:linear-gradient(to right,var(--pool-blue),var(--pool-deep));transform-origin:left;transform:translateZ(2px) rotateY(90deg);border-right:2px solid #155a75}

/* Overflow tank sides */
.ot-front{width:312px;height:40px;left:24px;top:256px;background:linear-gradient(to bottom,var(--overflow-tank),#3d4a50);transform-origin:top;transform:translateZ(1px) rotateX(-90deg)}
.ot-right{width:40px;height:232px;left:336px;top:24px;background:linear-gradient(to right,var(--overflow-tank),#3d4a50);transform-origin:left;transform:translateZ(1px) rotateY(90deg)}

/* Overflow cascade */
.cascade-front{position:absolute;width:240px;height:6px;left:60px;top:220px;background:linear-gradient(to bottom,rgba(77,217,232,.6),transparent);transform:translateZ(2px) rotateX(-90deg);transform-origin:top;animation:cascadePulse 2s ease-in-out infinite}
.cascade-right{position:absolute;width:6px;height:160px;left:300px;top:60px;background:linear-gradient(to right,rgba(77,217,232,.6),transparent);transform:translateZ(2px) rotateY(90deg);transform-origin:left;animation:cascadePulse 2s ease-in-out infinite .5s}
.cascade-back{position:absolute;width:240px;height:6px;left:60px;top:60px;background:linear-gradient(to top,rgba(77,217,232,.5),transparent);transform:translateZ(2px) rotateX(90deg);transform-origin:bottom;animation:cascadePulse 2s ease-in-out infinite .3s}
.cascade-left{position:absolute;width:6px;height:160px;left:60px;top:60px;background:linear-gradient(to left,rgba(77,217,232,.5),transparent);transform:translateZ(2px) rotateY(-90deg);transform-origin:right;animation:cascadePulse 2s ease-in-out infinite .7s}

/* 3D Labels */
.label-3d{position:absolute;font-size:10px;color:#fff;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:3px;white-space:nowrap;transform:translateZ(60px);pointer-events:none}

@keyframes ripple{0%{transform:translateX(0)}100%{transform:translateX(20px)}}
@keyframes ripple2{0%{transform:translateY(0)}100%{transform:translateY(16px)}}
@keyframes overflowPulse{0%,100%{opacity:.5}50%{opacity:.8}}
@keyframes cascadePulse{0%,100%{opacity:.3}50%{opacity:.8}}

/* ===== TOP VIEW ===== */
.top-view{position:relative;width:100%;max-width:600px}
.top-view svg{width:100%;height:auto}

/* ===== CROSS SECTION ===== */
.cross-section{position:relative;width:100%;max-width:650px}
.cross-section svg{width:100%;height:auto}

/* Dims panel */
.dims{max-width:700px;margin:0 auto;padding:0 16px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;text-align:center}
.dim-card{background:rgba(255,255,255,.05);border-radius:8px;padding:12px 8px}
.dim-card .val{font-size:1.3rem;font-weight:600;color:var(--water-top)}
.dim-card .lbl{font-size:.7rem;color:#999;margin-top:2px}

@media(max-width:500px){
  .pool-3d{transform:rotateX(55deg) rotateZ(-35deg) scale(.7)}
  .scene-3d{height:320px}
}
</style>
</head>
<body>

<header>
  <h1>Soluna Pool — Perimeter Overflow Design</h1>
  <p>Interactive 3D visualization</p>
</header>

<nav class="tabs">
  <button class="active" data-view="v3d">3D Perspective</button>
  <button data-view="vtop">Top View</button>
  <button data-view="vside">Side Cross-Section</button>
</nav>

<!-- 3D VIEW -->
<section class="view active" id="v3d">
  <div class="scene-3d">
    <div class="pool-3d">
      <div class="face deck"></div>
      <div class="face overflow-ring"></div>
      <div class="face pool-top"></div>
      <div class="face pool-front"></div>
      <div class="face pool-right"></div>
      <div class="face ot-front"></div>
      <div class="face ot-right"></div>
      <div class="cascade-front"></div>
      <div class="cascade-right"></div>
      <div class="cascade-back"></div>
      <div class="cascade-left"></div>
      <span class="label-3d" style="left:120px;top:265px">12m</span>
      <span class="label-3d" style="left:310px;top:130px">4m</span>
      <span class="label-3d" style="left:305px;top:245px">1.5m deep</span>
      <span class="label-3d" style="left:24px;top:36px">0.70m overflow</span>
    </div>
  </div>
</section>

<!-- TOP VIEW -->
<section class="view" id="vtop">
  <div class="top-view">
    <svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">
      <!-- Deck -->
      <rect x="20" y="20" width="560" height="300" rx="6" fill="#c4a882" stroke="#a8906e" stroke-width="2"/>
      <!-- Overflow tank -->
      <rect x="50" y="50" width="500" height="240" rx="4" fill="#5a6a72" stroke="#4a5a62" stroke-width="1.5"/>
      <!-- Overflow water -->
      <rect x="50" y="50" width="500" height="240" rx="4" fill="#3a8fa8" opacity=".5">
        <animate attributeName="opacity" values=".4;.7;.4" dur="3s" repeatCount="indefinite"/>
      </rect>
      <!-- Main pool -->
      <rect x="80" y="80" width="440" height="180" rx="2" fill="url(#poolGrad)" stroke="#1a6b8a" stroke-width="1"/>
      <!-- Ripple lines -->
      <g stroke="rgba(255,255,255,.15)" stroke-width=".7" fill="none">
        <line x1="90" y1="120" x2="510" y2="120"><animate attributeName="y1" values="120;125;120" dur="3s" repeatCount="indefinite"/><animate attributeName="y2" values="120;125;120" dur="3s" repeatCount="indefinite"/></line>
        <line x1="90" y1="160" x2="510" y2="160"><animate attributeName="y1" values="160;155;160" dur="4s" repeatCount="indefinite"/><animate attributeName="y2" values="155;160;155" dur="4s" repeatCount="indefinite"/></line>
        <line x1="90" y1="200" x2="510" y2="200"><animate attributeName="y1" values="200;205;200" dur="3.5s" repeatCount="indefinite"/><animate attributeName="y2" values="205;200;205" dur="3.5s" repeatCount="indefinite"/></line>
      </g>
      <!-- Overflow arrows -->
      <g fill="none" stroke="#4dd9e8" stroke-width="1" opacity=".6">
        <line x1="300" y1="80" x2="300" y2="55" marker-end="url(#arr)"><animate attributeName="opacity" values=".3;.8;.3" dur="2s" repeatCount="indefinite"/></line>
        <line x1="300" y1="260" x2="300" y2="285" marker-end="url(#arr)"><animate attributeName="opacity" values=".3;.8;.3" dur="2s" repeatCount="indefinite" begin=".5s"/></line>
        <line x1="80" y1="170" x2="55" y2="170" marker-end="url(#arr)"><animate attributeName="opacity" values=".3;.8;.3" dur="2s" repeatCount="indefinite" begin=".3s"/></line>
        <line x1="520" y1="170" x2="545" y2="170" marker-end="url(#arr)"><animate attributeName="opacity" values=".3;.8;.3" dur="2s" repeatCount="indefinite" begin=".7s"/></line>
      </g>
      <defs>
        <linearGradient id="poolGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4dd9e8"/><stop offset="100%" stop-color="#2d9ecf"/></linearGradient>
        <marker id="arr" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4dd9e8"/></marker>
      </defs>
      <!-- Dimension labels -->
      <g font-family="system-ui" font-size="11" fill="#fff">
        <!-- Pool length -->
        <line x1="80" y1="290" x2="520" y2="290" stroke="#fff" stroke-width=".5" opacity=".5"/>
        <text x="300" y="305" text-anchor="middle" font-weight="600">12m</text>
        <!-- Pool width -->
        <line x1="545" y1="80" x2="545" y2="260" stroke="#fff" stroke-width=".5" opacity=".5"/>
        <text x="560" y="175" text-anchor="start" font-weight="600">4m</text>
        <!-- Overflow width label -->
        <text x="65" y="72" font-size="9" fill="#ccc">0.70m</text>
        <line x1="50" y1="46" x2="80" y2="46" stroke="#ccc" stroke-width=".5"/>
      </g>
    </svg>
  </div>
</section>

<!-- CROSS SECTION VIEW -->
<section class="view" id="vside">
  <div class="cross-section">
    <svg viewBox="0 0 650 320" xmlns="http://www.w3.org/2000/svg">
      <!-- Ground line -->
      <line x1="20" y1="260" x2="630" y2="260" stroke="#555" stroke-width="1" stroke-dasharray="4"/>
      <!-- Deck left -->
      <rect x="30" y="100" width="60" height="20" fill="#c4a882" stroke="#a8906e"/>
      <!-- Overflow tank left -->
      <rect x="90" y="100" width="50" height="150" fill="#5a6a72" stroke="#4a5a62" stroke-width="1.5"/>
      <!-- Overflow water left -->
      <rect x="91" y="120" width="48" height="129" fill="#3a8fa8" opacity=".6">
        <animate attributeName="opacity" values=".4;.7;.4" dur="3s" repeatCount="indefinite"/>
      </rect>
      <!-- Pool wall left -->
      <rect x="140" y="80" width="12" height="170" fill="#d0d0d0" stroke="#999"/>
      <!-- Main pool -->
      <rect x="152" y="80" width="346" height="170" fill="#1a3a4a" stroke="#155a75"/>
      <!-- Pool water -->
      <rect x="153" y="81" width="344" height="168" fill="url(#waterGrad)">
        <animate attributeName="opacity" values=".85;1;.85" dur="4s" repeatCount="indefinite"/>
      </rect>
      <!-- Water surface shimmer -->
      <line x1="160" y1="85" x2="490" y2="85" stroke="rgba(255,255,255,.3)" stroke-width="1.5">
        <animate attributeName="opacity" values=".2;.5;.2" dur="2s" repeatCount="indefinite"/>
      </line>
      <!-- Pool wall right -->
      <rect x="498" y="80" width="12" height="170" fill="#d0d0d0" stroke="#999"/>
      <!-- Overflow tank right -->
      <rect x="510" y="100" width="50" height="150" fill="#5a6a72" stroke="#4a5a62" stroke-width="1.5"/>
      <!-- Overflow water right -->
      <rect x="511" y="120" width="48" height="129" fill="#3a8fa8" opacity=".6">
        <animate attributeName="opacity" values=".4;.7;.4" dur="3s" repeatCount="indefinite" begin="1s"/>
      </rect>
      <!-- Deck right -->
      <rect x="560" y="100" width="60" height="20" fill="#c4a882" stroke="#a8906e"/>
      <!-- Overflow cascade left -->
      <path d="M152,82 Q145,90 141,100 Q138,108 138,120" fill="none" stroke="#4dd9e8" stroke-width="2" opacity=".5">
        <animate attributeName="opacity" values=".2;.7;.2" dur="2s" repeatCount="indefinite"/>
      </path>
      <!-- Overflow cascade right -->
      <path d="M498,82 Q505,90 509,100 Q512,108 512,120" fill="none" stroke="#4dd9e8" stroke-width="2" opacity=".5">
        <animate attributeName="opacity" values=".2;.7;.2" dur="2s" repeatCount="indefinite" begin=".5s"/>
      </path>
      <!-- Dimension labels -->
      <defs>
        <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4dd9e8"/><stop offset="100%" stop-color="#1a6b8a"/></linearGradient>
      </defs>
      <g font-family="system-ui" font-size="10" fill="#e0e0e0">
        <!-- Pool depth -->
        <line x1="530" y1="82" x2="530" y2="250" stroke="#fff" stroke-width=".5" opacity=".4"/>
        <text x="534" y="170" font-size="11" font-weight="600">1.5m</text>
        <text x="534" y="182" font-size="9" fill="#aaa">depth</text>
        <!-- Overflow tank depth -->
        <line x1="75" y1="102" x2="75" y2="250" stroke="#ccc" stroke-width=".5" opacity=".4"/>
        <text x="55" y="185" font-size="10" fill="#ccc">1.2m</text>
        <!-- Overflow tank width -->
        <line x1="90" y1="270" x2="140" y2="270" stroke="#ccc" stroke-width=".5"/>
        <text x="100" y="283" font-size="10" fill="#ccc">0.70m</text>
        <!-- Pool width -->
        <line x1="152" y1="270" x2="498" y2="270" stroke="#fff" stroke-width=".5"/>
        <text x="310" y="283" font-size="11" font-weight="600" text-anchor="middle">4m (width)</text>
        <!-- Water level label -->
        <text x="200" y="77" font-size="9" fill="#4dd9e8">← water level (flush)</text>
        <!-- Labels -->
        <text x="110" y="145" font-size="8" fill="#ccc" text-anchor="middle">overflow</text>
        <text x="110" y="155" font-size="8" fill="#ccc" text-anchor="middle">tank</text>
        <text x="325" y="175" font-size="12" fill="#fff" text-anchor="middle" opacity=".6">MAIN POOL</text>
        <text x="535" y="145" font-size="8" fill="#ccc">overflow</text>
        <text x="535" y="155" font-size="8" fill="#ccc">tank</text>
        <text x="60" y="113" font-size="8" fill="#a8906e">deck</text>
        <text x="575" y="113" font-size="8" fill="#a8906e">deck</text>
      </g>
    </svg>
  </div>
</section>

<!-- Dimensions -->
<div class="dims">
  <div class="dim-card"><div class="val">12m</div><div class="lbl">Pool Length</div></div>
  <div class="dim-card"><div class="val">4m</div><div class="lbl">Pool Width</div></div>
  <div class="dim-card"><div class="val">1.5m</div><div class="lbl">Pool Depth</div></div>
  <div class="dim-card"><div class="val">0.70m</div><div class="lbl">Overflow Tank Width</div></div>
  <div class="dim-card"><div class="val">1.2m</div><div class="lbl">Overflow Tank Depth</div></div>
  <div class="dim-card"><div class="val">~54m²</div><div class="lbl">Pool Surface</div></div>
</div>

<script>
document.querySelectorAll('.tabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.view).classList.add('active');
  });
});
</script>
</body>
</html>
