<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soluna Villa — Raised Tie Truss Proposal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f8f6f2;color:#333;display:flex;flex-direction:column;align-items:center;padding:20px 10px}
h1{font-size:clamp(1.1rem,3vw,1.6rem);text-align:center;margin-bottom:4px;color:#2c2c2c}
h2{font-size:clamp(0.8rem,2vw,1rem);text-align:center;color:#666;font-weight:400;margin-bottom:20px}
.diagram-wrap{width:100%;max-width:900px;aspect-ratio:4/3}
svg{width:100%;height:100%}
.label{font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;fill:#444}
.label-bold{font-family:'Segoe UI',system-ui,sans-serif;font-size:12px;fill:#333;font-weight:700}
.height-mark{font-family:'Segoe UI',system-ui,sans-serif;font-size:10px;fill:#888;text-anchor:end}
.dim{font-family:'Segoe UI',system-ui,sans-serif;font-size:9px;fill:#888}
</style>
</head>
<body>
<h1>Soluna Villa — Raised Tie Truss Proposal</h1>
<h2>Eliminating the center pole while keeping the raked ceiling</h2>
<div class="diagram-wrap">
<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrowUp" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
<path d="M0,6 L4,0 L8,6" fill="none" stroke="#3a7ab5" stroke-width="1.2"/>
</marker>
<marker id="arrowDown" markerWidth="8" markerHeight="6" refX="4" refY="0" orient="auto">
<path d="M0,0 L4,6 L8,0" fill="none" stroke="#3a7ab5" stroke-width="1.2"/>
</marker>
<marker id="dimUp" markerWidth="6" markerHeight="5" refX="3" refY="5" orient="auto">
<path d="M0,5 L3,0 L6,5" fill="none" stroke="#999" stroke-width="1"/>
</marker>
<marker id="dimDown" markerWidth="6" markerHeight="5" refX="3" refY="0" orient="auto">
<path d="M0,0 L3,5 L6,0" fill="none" stroke="#999" stroke-width="1"/>
</marker>
</defs>

<!-- Scale: 40px per meter. Ground y=420. -->
<!-- Heights: 0m=420, 2.95m=302, 3.21m=291.6, 4.80m=228, 6.0m=180, 7.54m=118.4 -->
<!-- Walls: left x=170, right x=550 (span=380px=9.5m) center=360 -->
<!-- Left overhang: 3.20m=128px → eave tip x=42 -->
<!-- Left columns: 2.75m from wall → x=60 -->

<!-- Ground -->
<rect x="30" y="420" width="640" height="4" fill="#8B7355"/>

<!-- Height ruler line -->
<line x1="25" y1="420" x2="25" y2="100" stroke="#ddd" stroke-width="0.5"/>

<!-- Height markers 0-8m -->
<g>
<line x1="20" y1="420" x2="28" y2="420" stroke="#bbb" stroke-width="1"/>
<text x="16" y="424" class="height-mark">0m</text>
<line x1="20" y1="380" x2="28" y2="380" stroke="#bbb" stroke-width="1"/>
<text x="16" y="384" class="height-mark">1m</text>
<line x1="20" y1="340" x2="28" y2="340" stroke="#bbb" stroke-width="1"/>
<text x="16" y="344" class="height-mark">2m</text>
<line x1="20" y1="300" x2="28" y2="300" stroke="#bbb" stroke-width="1"/>
<text x="16" y="304" class="height-mark">3m</text>
<line x1="20" y1="260" x2="28" y2="260" stroke="#bbb" stroke-width="1"/>
<text x="16" y="264" class="height-mark">4m</text>
<line x1="20" y1="220" x2="28" y2="220" stroke="#bbb" stroke-width="1"/>
<text x="16" y="224" class="height-mark">5m</text>
<line x1="20" y1="180" x2="28" y2="180" stroke="#bbb" stroke-width="1"/>
<text x="16" y="184" class="height-mark">6m</text>
<line x1="20" y1="140" x2="28" y2="140" stroke="#bbb" stroke-width="1"/>
<text x="16" y="144" class="height-mark">7m</text>
<line x1="20" y1="100" x2="28" y2="100" stroke="#bbb" stroke-width="1"/>
<text x="16" y="104" class="height-mark">8m</text>
</g>

<!-- Foundation -->
<rect x="158" y="420" width="24" height="8" fill="#a89878"/>
<rect x="538" y="420" width="24" height="8" fill="#a89878"/>

<!-- Walls (4.80m tall, from ground 420 to 228) -->
<rect x="166" y="228" width="12" height="192" fill="#d4c5a9" stroke="#a89878" stroke-width="1"/>
<rect x="546" y="228" width="12" height="192" fill="#d4c5a9" stroke="#a89878" stroke-width="1"/>

<!-- Left overhang columns (3.21m tall, ground to 291.6) -->
<rect x="57" y="291.6" width="8" height="128.4" fill="#c4b896" stroke="#a89878" stroke-width="1"/>

<!-- Outer tile roof -->
<!-- Left slope: eave tip (42,302) → ridge (360,118.4) -->
<!-- Right slope: ridge (360,118.4) → right eave (558,228) — slight overhang on right -->
<polygon points="42,302 360,118.4 570,228 558,228 360,130 54,302" fill="#b5694d" opacity="0.8"/>
<!-- Roof outlines -->
<line x1="42" y1="302" x2="360" y2="118.4" stroke="#8B4513" stroke-width="2.5"/>
<line x1="360" y1="118.4" x2="570" y2="228" stroke="#8B4513" stroke-width="2.5"/>
<!-- Eave tips -->
<line x1="36" y1="305" x2="42" y2="302" stroke="#8B4513" stroke-width="2"/>
<line x1="570" y1="228" x2="576" y2="231" stroke="#8B4513" stroke-width="2"/>

<!-- Tile texture hints on roof -->
<g opacity="0.15" stroke="#5a2a0a" stroke-width="0.5">
<line x1="80" y1="280" x2="200" y2="211"/>
<line x1="100" y1="268" x2="250" y2="196"/>
<line x1="120" y1="256" x2="300" y2="173"/>
<line x1="400" y1="180" x2="540" y2="222"/>
<line x1="390" y1="170" x2="520" y2="209"/>
</g>

<!-- Hidden truss zone highlight (between ~6.0m ceiling and ridge 7.54m) -->
<!-- At 6.0m (y=180): left roof x = lerp from eave(42,302) to ridge(360,118.4) at y=180 -->
<!-- t = (302-180)/(302-118.4) = 122/183.6 = 0.664 → x = 42 + 0.664*(360-42) = 42+211 = 253 -->
<!-- Right at y=180: t = (228-180)/(228-118.4) = 48/109.6 = 0.438 → x = 570 - 0.438*(570-360) = 570-92 = 478 -->
<polygon points="253,180 360,118.4 478,180" fill="#b0d4f1" opacity="0.25" stroke="#6ba3d6" stroke-width="1" stroke-dasharray="5,3"/>

<!-- Truss structure (steel grey) — bottom chord at 6.0m (y=180) -->
<!-- Bottom chord -->
<line x1="253" y1="180" x2="478" y2="180" stroke="#555" stroke-width="3"/>
<!-- Left rafter (inside line) -->
<line x1="253" y1="180" x2="360" y2="122" stroke="#555" stroke-width="2.5"/>
<!-- Right rafter -->
<line x1="360" y1="122" x2="478" y2="180" stroke="#555" stroke-width="2.5"/>

<!-- Web members -->
<!-- King post -->
<line x1="360" y1="122" x2="360" y2="180" stroke="#555" stroke-width="2"/>
<!-- Diagonals -->
<line x1="360" y1="180" x2="306" y2="151" stroke="#555" stroke-width="1.5"/>
<line x1="360" y1="180" x2="419" y2="151" stroke="#555" stroke-width="1.5"/>
<!-- Verticals at quarter points -->
<line x1="306" y1="151" x2="306" y2="180" stroke="#555" stroke-width="1.5"/>
<line x1="419" y1="151" x2="419" y2="180" stroke="#555" stroke-width="1.5"/>

<!-- Joint circles -->
<circle cx="253" cy="180" r="3.5" fill="#555"/>
<circle cx="478" cy="180" r="3.5" fill="#555"/>
<circle cx="360" cy="122" r="3.5" fill="#555"/>
<circle cx="360" cy="180" r="3.5" fill="#555"/>
<circle cx="306" cy="151" r="3" fill="#555"/>
<circle cx="419" cy="151" r="3" fill="#555"/>

<!-- Raked ceiling (from walls at 4.80m sloping up to ~6.0m at center) -->
<!-- Left: (178,228) to (360,180), Right: (360,180) to (546,228) -->
<line x1="178" y1="228" x2="360" y2="180" stroke="#c4913e" stroke-width="3.5"/>
<line x1="360" y1="180" x2="546" y2="228" stroke="#c4913e" stroke-width="3.5"/>
<!-- Subtle ceiling fill -->
<polygon points="178,228 360,180 546,228" fill="#f5e6c8" opacity="0.12"/>

<!-- Center pole (eliminated) — dashed from ground to ~6m -->
<line x1="360" y1="420" x2="360" y2="180" stroke="#cc3333" stroke-width="2" stroke-dasharray="8,4" opacity="0.4"/>
<!-- Red X at center of living room -->
<g transform="translate(360,310)">
<line x1="-20" y1="-20" x2="20" y2="20" stroke="#dd2222" stroke-width="4.5" stroke-linecap="round"/>
<line x1="20" y1="-20" x2="-20" y2="20" stroke="#dd2222" stroke-width="4.5" stroke-linecap="round"/>
</g>

<!-- Furniture silhouettes for scale -->
<!-- Sofa -->
<rect x="230" y="392" width="75" height="24" rx="4" fill="#9e9080" opacity="0.45"/>
<rect x="230" y="385" width="75" height="9" rx="3" fill="#8a8070" opacity="0.45"/>
<!-- Coffee table -->
<rect x="330" y="398" width="55" height="14" rx="2" fill="#a09585" opacity="0.35"/>
<!-- Side table + lamp -->
<rect x="430" y="400" width="20" height="16" rx="2" fill="#a09585" opacity="0.35"/>
<line x1="440" y1="400" x2="440" y2="384" stroke="#a09585" stroke-width="1.5" opacity="0.35"/>
<circle cx="440" cy="382" r="6" fill="#d4c090" opacity="0.25"/>

<!-- Person for scale (~1.75m) -->
<g opacity="0.3">
<circle cx="490" cy="345" r="6" fill="#777"/>
<line x1="490" y1="351" x2="490" y2="398" stroke="#777" stroke-width="2"/>
<line x1="490" y1="362" x2="480" y2="377" stroke="#777" stroke-width="1.5"/>
<line x1="490" y1="362" x2="500" y2="377" stroke="#777" stroke-width="1.5"/>
<line x1="490" y1="398" x2="483" y2="418" stroke="#777" stroke-width="1.5"/>
<line x1="490" y1="398" x2="497" y2="418" stroke="#777" stroke-width="1.5"/>
</g>

<!-- LABELS -->

<!-- Tile Roof label -->
<text x="160" y="245" class="label-bold" fill="#7a3a1a" transform="rotate(-30,160,245)" font-size="11">Tile Roof (30°)</text>

<!-- Hidden Truss Structure -->
<text x="330" y="155" class="label-bold" fill="#3a7ab5" font-size="11" text-anchor="middle">Hidden Truss</text>
<text x="330" y="168" class="label-bold" fill="#3a7ab5" font-size="11" text-anchor="middle">Structure</text>

<!-- Raked Ceiling label -->
<text x="430" y="210" class="label" fill="#9a6a20" font-size="10" transform="rotate(-15,430,210)">Raked Ceiling</text>
<text x="430" y="222" class="label" fill="#9a6a20" font-size="9" transform="rotate(-15,430,222)">(visible from inside)</text>

<!-- Living Room -->
<text x="340" y="365" class="label-bold" fill="#666" font-size="14" text-anchor="middle">Living Room</text>

<!-- NO CENTER POLE -->
<text x="360" y="288" text-anchor="middle" class="label-bold" fill="#dd2222" font-size="12">NO CENTER</text>
<text x="360" y="303" text-anchor="middle" class="label-bold" fill="#dd2222" font-size="12">POLE ❌</text>

<!-- ~1.5m cavity annotation (right side arrow) -->
<line x1="590" y1="180" x2="590" y2="118.4" stroke="#3a7ab5" stroke-width="1.5" marker-start="url(#arrowDown)" marker-end="url(#arrowUp)"/>
<text x="598" y="143" class="label" fill="#3a7ab5" font-size="10">~1.5m</text>
<text x="598" y="155" class="label" fill="#3a7ab5" font-size="10">cavity</text>
<text x="598" y="167" class="label" fill="#3a7ab5" font-size="10">for truss</text>

<!-- Key height labels -->
<!-- Ridge -->
<text x="360" y="112" text-anchor="middle" class="label" fill="#7a3a1a" font-size="10">Ridge 7.54m</text>

<!-- Bottom chord / ceiling center -->
<text x="248" y="177" class="label" fill="#555" font-size="9" text-anchor="end">6.0m —</text>

<!-- Wall height -->
<text x="163" y="226" class="label" fill="#888" font-size="9" text-anchor="end">4.80m</text>

<!-- Column height -->
<text x="50" y="289" class="label" fill="#888" font-size="8" text-anchor="end">3.21m</text>

<!-- Eave tip -->
<text x="38" y="299" class="label" fill="#888" font-size="8" text-anchor="end">2.95m</text>

<!-- Overhang dimension (horizontal) -->
<line x1="42" y1="435" x2="170" y2="435" stroke="#999" stroke-width="1"/>
<line x1="42" y1="430" x2="42" y2="440" stroke="#999" stroke-width="1"/>
<line x1="170" y1="430" x2="170" y2="440" stroke="#999" stroke-width="1"/>
<text x="106" y="448" class="dim" font-size="9" text-anchor="middle" fill="#777">3.20m overhang</text>

<!-- Column position marker -->
<line x1="61" y1="430" x2="61" y2="440" stroke="#999" stroke-width="0.8"/>
<text x="61" y="458" class="dim" font-size="8" text-anchor="middle" fill="#999">col. 2.75m</text>

<!-- Span dimension -->
<line x1="170" y1="465" x2="550" y2="465" stroke="#999" stroke-width="1"/>
<line x1="170" y1="460" x2="170" y2="470" stroke="#999" stroke-width="1"/>
<line x1="550" y1="460" x2="550" y2="470" stroke="#999" stroke-width="1"/>
<text x="360" y="475" class="dim" font-size="10" text-anchor="middle" fill="#777">9.50m span</text>

</svg>
</div>
<p style="text-align:center;color:#999;font-size:0.75rem;margin-top:12px">Cross-section diagram — dimensions from architectural plans. Not to scale.</p>
</body>
</html>
